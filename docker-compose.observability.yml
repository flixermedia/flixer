# Log aggregation for apps running outside Docker (or anywhere they write JSON logs to LOG_DIR).
# Usage: docker compose -f docker-compose.observability.yml up -d
# Then open Grafana at http://localhost:3000 (Explore -> Loki -> {app="streamer"}).
name: flixer-observability

services:
    loki:
        image: grafana/loki:3.7.8
        command: ["-config.file=/etc/loki/loki.yml"]
        volumes:
            - ./deploy/observability/loki.yml:/etc/loki/loki.yml:ro
            - loki-data:/loki
        ports:
            - "127.0.0.1:3100:3100"
        restart: unless-stopped

    alloy:
        image: grafana/alloy:v1.21.0
        command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
        volumes:
            - ./deploy/observability/alloy.alloy:/etc/alloy/config.alloy:ro
            - ${LOG_PATH:-../flixer-data/logs}:/logs:ro
            - alloy-data:/var/lib/alloy/data
        ports:
            - "127.0.0.1:12345:12345"
        depends_on:
            - loki
        restart: unless-stopped

    grafana:
        image: grafana/grafana:13.0.11
        environment:
            GF_AUTH_ANONYMOUS_ENABLED: "true"
            GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
            GF_AUTH_DISABLE_LOGIN_FORM: "true"
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flixer-logs.json
        volumes:
            - ./deploy/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
            - ./deploy/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/flixer.yml:ro
            - ./deploy/observability/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana
        ports:
            - "127.0.0.1:3000:3000"
        depends_on:
            - loki
        restart: unless-stopped

volumes:
    loki-data:
    alloy-data:
    grafana-data:
