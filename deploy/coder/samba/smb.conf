[global]
   server role = standalone server
   security = user
   map to guest = Never
   disable netbios = yes
   server min protocol = SMB2_10
   server max protocol = SMB3
   store dos attributes = yes
   map archive = no

[projects]
   path = /home/coder/projects
   browseable = yes
   read only = no
   guest ok = no
   valid users = coder
   force user = coder
   force group = coder
   create mask = 0777
   force create mode = 0700
   directory mask = 0777
   force directory mode = 0700
