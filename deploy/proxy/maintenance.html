<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flixer — Updating</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080811;
      --surface: #14131d;
      --primary: #7645d7;
      --accent: #a789ff;
      --text: #f4f4f8;
      --muted: #a19eb7;
      --border: rgba(167, 137, 255, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 34rem 26rem at 50% 0%, rgba(118, 69, 215, 0.24), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      display: block;
      filter: drop-shadow(0 8px 20px rgba(118, 69, 215, 0.35));
    }
    .card {
      width: 100%;
      padding: 32px;
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(20, 19, 29, 0.94), rgba(20, 19, 29, 0.78));
      border: 1px solid var(--border);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7), 0 0 40px rgba(118, 69, 215, 0.12);
      text-align: center;
      backdrop-filter: blur(16px);
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 18px;
      border-radius: 9999px;
      border: 3px solid rgba(167, 137, 255, 0.18);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }
    h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
    .status {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(118, 69, 215, 0.14);
      border: 1px solid rgba(167, 137, 255, 0.2);
      font-size: 12px;
      color: var(--accent);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" role="status" aria-live="polite">
      <svg class="logo" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" aria-hidden="true">
        <defs>
          <linearGradient id="flixer-grad" gradientUnits="userSpaceOnUse" x1="1840.928" y1="210.125" x2="1840.928" y2="2124.629" gradientTransform="matrix(0.788665, -0.614824, 0.614089, 0.787722, -1032.916269, 1287.655028)">
            <stop offset="0.154" stop-color="#bf12eb" />

          <path d="M 1017.83 380.71 C 1071.92 381.15 1134.65 373.919 1187.43 384.065 C 1216.01 389.56 1510.7 530.574 1532.71 551.558 C 1540.79 559.268 1545.08 567.483 1545.04 578.861 C 1544.98 591.515 1539.7 604.229 1529.9 612.426 C 1506.03 632.437 1208.6 775.415 1181.77 780.435 C 1145.54 787.207 1100.56 782.282 1063.52 782.153 L 834.719 782.343 C 834.807 838.378 835.377 895.138 834.784 951.108 C 919.349 949.436 1003.94 949.049 1088.52 949.961 C 1224.31 950.238 1325.19 930.908 1323.43 1105.83 C 1321.72 1277.53 1206.31 1255.63 1080.13 1255.15 L 835.453 1255.18 C 834.639 1307.24 834.484 1359.36 834.989 1411.46 C 835.339 1477.46 845.511 1558.99 794.321 1609.01 C 745.469 1656.72 679.337 1647.66 617.239 1647.27 C 577.711 1647.1 538.677 1629.57 511.637 1600.54 C 496.425 1584.44 485.888 1564.5 481.149 1542.89 C 472.816 1502.97 476.627 1417.37 475.996 1373.86 C 474.317 1258.14 478.854 1138.35 475.582 1023.06 C 477.581 992.026 476.27 940.282 476.27 908.07 L 475.761 683.33 C 475.67 638.372 472.808 569.615 482.631 528.085 C 490.767 492.684 508.76 460.308 534.528 434.696 C 559.083 411.227 589.54 394.842 622.66 387.28 C 662.119 378.183 739.833 380.858 782.211 380.884 L 1017.83 380.71 Z" fill="#fefefe" />
        </g>
      </svg>
      <h1>Flixer is Updating</h1>
      <p>An update is currently in progress. This page will automatically reload as soon as the server is back online.</p>
      <div class="status" id="status">Checking server status…</div>
    </main>
  </div>
  <script>
    (function poll() {
      fetch('/api/setup/status', { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) return null;
          return res.json();
        })
        .then(function (data) {
          if (data && data.maintenance !== true) {
            window.location.reload();
            return;
          }
          setTimeout(poll, 4000);
        })
        .catch(function () {
          setTimeout(poll, 4000);
        });
    })();
  </script>
</body>
</html>
