map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_origin $cors_origin {
    # Native WebViews have fixed localhost origins; browser requests are proxied same-origin.
    default                   "";
    "https://localhost"      $http_origin;
    "http://localhost"       $http_origin;
    "ionic://localhost"      $http_origin;
    "capacitor://localhost"  $http_origin;
}

map "$request_method:$uri" $cors_preflight {
    default 0;
    "~^OPTIONS:/api/oidc/" 0;
    "~^OPTIONS:/\.well-known/oauth-authorization-server/api/oidc$" 0;
    "~^OPTIONS:" 1;
}

upstream flixer_api {
    server api:8081;
}

upstream flixer_streamer {
    server streamer:8091;
}

upstream flixer_web {
    server web:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, If-Modified-Since, If-Range, Range, X-Setup-Recovery-Code" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Vary Origin always;

    if ($cors_preflight = 1) {
        return 204;
    }

    location = /healthz {
        access_log off;
        return 204;
    }

    location ^~ /api/oidc/ {
        access_log off;
        proxy_pass http://flixer_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Credentials;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
        proxy_pass_header Access-Control-Expose-Headers;
        proxy_pass_header Access-Control-Max-Age;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /.well-known/oauth-authorization-server/api/oidc {
        proxy_pass http://flixer_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        proxy_pass http://flixer_api;
        proxy_http_version 1.1;
        proxy_set_header Origin "";

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Long-lived connections
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Useful for live streaming responses
        proxy_buffering off;
    }

    location ^~ /streamer/ {
        proxy_pass http://flixer_streamer;
        proxy_http_version 1.1;
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://flixer_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
