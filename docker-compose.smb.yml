# Lets flixer connect SMB shares itself (Admin > Libraries > Network shares) when running in Docker.
#
#   docker compose -f docker-compose.yml -f docker-compose.smb.yml up -d
#
# Needs a Linux host: Docker Desktop on Windows/macOS cannot provide the shared mount propagation
# required to mount SMB shares inside the API container. There, mount the share on the host and
# include it in MEDIA_PATH instead.
services:
    api:
        user: root
        cap_add:
            - SYS_ADMIN
            - DAC_READ_SEARCH
        security_opt:
            - apparmor:unconfined
        volumes:
            - type: bind
              source: ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/mounts
              target: /data/mounts
              bind:
                  propagation: rshared

    streamer:
        volumes:
            - type: bind
              source: ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/mounts
              target: /data/mounts
              read_only: true
              bind:
                  propagation: rslave

    indexer:
        volumes:
            - type: bind
              source: ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/mounts
              target: /data/mounts
              bind:
                  propagation: rslave
