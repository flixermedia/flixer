name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Pushing to main releases package.json's version when its tag does not exist yet.
      # Pushing a v* tag manually is still supported and must match package.json.
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vX.Y.Z (for example, v1.2.3)." >&2
              exit 1
            fi
            if [[ "${GITHUB_REF_NAME#v}" != "$package_version" ]]; then
              echo "Tag version ${GITHUB_REF_NAME#v} does not match package.json version $package_version." >&2
              exit 1
            fi
            release=true
            create_tag=false
          elif git ls-remote --exit-code --tags origin "refs/tags/v$package_version" >/dev/null 2>&1; then
            echo "Tag v$package_version already exists; nothing to release."
            release=false
            create_tag=false
          else
            release=true
            create_tag=true
          fi

          {
            echo "package_version=$package_version"
            echo "release=$release"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.version.outputs.release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        if: steps.version.outputs.release == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.package_version }}
            type=raw,value=latest

      - name: Build and publish Docker image
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.package_version }}

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.package_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
