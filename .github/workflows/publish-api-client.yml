name: Publish API client

on:
  push:
    branches:
      - main
    paths:
      - "packages/flixer-api-client/**"
      - "orval.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Generate and build client
        run: |
          npm run api-client:generate
          npm run build --prefix packages/flixer-api-client
          npm test --prefix packages/flixer-api-client

      - name: Check whether this version is already published
        id: published
        run: |
          version="$(node -p "require('./packages/flixer-api-client/package.json').version")"
          if npm view "flixer-api-client@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.published.outputs.already_published == 'false'
        working-directory: packages/flixer-api-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
