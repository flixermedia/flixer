name: Publish Coder workspace image

on:
  push:
    branches: [main]
    paths:
      - deploy/coder/build/**
      - .github/workflows/publish-coder-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-coder-workspace-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish workspace image
        uses: docker/build-push-action@v6
        with:
          context: deploy/coder/build
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/flixermedia/coder-flixer-workspace:latest
            ghcr.io/flixermedia/coder-flixer-workspace:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
