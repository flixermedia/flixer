name: Publish installer

# Publishes install.sh to GitHub Pages so `curl -fsSL https://get.flixer.dev | bash` always serves main.
# One-time setup: Settings > Pages > Source: GitHub Actions, custom domain get.flixer.dev,
# and a DNS CNAME for get.flixer.dev pointing at flixermedia.github.io.
on:
    push:
        branches: [main]
        paths: [install.sh, install.ps1, manage.sh, manage.ps1, deploy/docker/installer.test.mjs, deploy/docker/installer.test.ps1, .github/workflows/publish-installer.yml]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    windows-test:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - run: ./deploy/docker/installer.test.ps1
              shell: pwsh
            - run: ./deploy/docker/installer.test.ps1
              shell: powershell
    deploy:
        needs: windows-test
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - name: Lint installer
              run: |
                  bash -n install.sh
                  sudo apt-get install -y shellcheck >/dev/null
                  shellcheck -S warning install.sh manage.sh
                  FLIXER_TEST_PWSH="$(command -v pwsh)" node --test deploy/docker/installer.test.mjs
            - name: Build site
              run: |
                  mkdir site
                  cp install.sh site/index.html
                  cp install.sh site/install.sh
                  cp install.ps1 site/install.ps1
                  echo get.flixer.dev > site/CNAME
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site
            - id: deployment
              uses: actions/deploy-pages@v4
