# Development stack: the same as docker-compose.yml, but the API, streamer, indexer and web are built from the sibling
# checkouts (../flixer-streamer, ../flixer-indexer, ../flixer-web) instead of pulling published images.
# Usage: docker compose -f docker-compose.dev.yml up --build
# Settings (in .env next to this file): DATA_PATH is required, MEDIA_PATH defaults to ./media.
name: flixer-dev

services:
    # Creates the data folders and hands them to the users the services run as, then exits.
    data-init:
        image: alpine:3
        command:
            - /bin/sh
            - -c
            - mkdir -p /data/avatars /data/metadata/artwork /data/logs /data/mounts || exit 1; chown -R 1000:1000 /data/avatars /data/metadata/artwork 2>/dev/null || true; chown 65532:65532 /data/metadata 2>/dev/null || true; chown 1000:1000 /data/mounts 2>/dev/null || true; chmod 0777 /data/logs 2>/dev/null || true
        volumes:
            - ${DATA_PATH:?Set DATA_PATH in .env to the folder for Flixer's data}:/data
        restart: "no"

    api:
        build:
            context: .
            dockerfile: Dockerfile
        image: flixer-dev/api:local
        depends_on:
            data-init:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
        environment:
            PORT: 8081
            NODE_ENV: development
            CONFIG_DIR: /var/lib/flixer/config
            STREAM_TOKEN_SECRET_FILE: /run/flixer-secrets/stream-token-secret
            AVATAR_DIR: /data/avatars
            METADATA_DIR: /data/metadata
            STREAM_MEDIA_ROOT: /media
            SMB_MOUNT_DIR: /data/mounts
            LOG_DIR: /data/logs
            STREAMER_PUBLIC_URL: ""
            STREAMER_INTERNAL_URL: http://streamer:8091
            INDEXER_URL: http://indexer:8092
        volumes:
            - ${MEDIA_PATH:-./media}:/media:ro
            - flixer-config:/var/lib/flixer/config
            - flixer-secrets:/run/flixer-secrets
            - ${DATA_PATH:?Set DATA_PATH in .env to the folder for Flixer's data}/avatars:/data/avatars
            - ${DATA_PATH:?Set DATA_PATH in .env to the folder for Flixer's data}/logs:/data/logs
            - ${DATA_PATH:?Set DATA_PATH in .env to the folder for Flixer's data}/metadata:/data/metadata
            - ${DATA_PATH:?Set DATA_PATH in .env to the folder for Flixer's data}/mounts:/data/mounts
        expose:
            - "8081"
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "const s=require('node:net').connect(8081,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 45s
        restart: unless-stopped
        init: true

    streamer:
        build:
            context: ../flixer-streamer
            dockerfile: Dockerfile
        image: flixer-dev/streamer:local
        environment:
            PORT: 8091
            LOG_LEVEL: debug
            STREAM_TOKEN_SECRET_FILE: /run/flixer-secrets/stream-token-secret
            TRANSCODE_DIR: /var/cache/flixer/transcode
            FLIXER_URL: http://api:8081
            LOG_DIR: /data/logs
        volumes:
            - ${MEDIA_PATH:-./media}:/media:ro
            - flixer-secrets:/run/flixer-secrets:ro
            - ${DATA_PATH:?Set DATA_PATH in .env to the folder for Flixer's data}/logs:/data/logs
            - ${DATA_PATH:?Set DATA_PATH in .env to the folder for Flixer's data}/mounts:/data/mounts:ro
        expose:
            - "8091"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/healthz >/dev/null || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        init: true

    indexer:
        build:
            context: ../flixer-indexer
            dockerfile: Dockerfile
        image: flixer-dev/indexer:local
        depends_on:
            data-init:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        environment:
            PORT: 8092
            LOG_LEVEL: debug
            ROLE: all
            FLIXER_URL: http://api:8081
            LOG_DIR: /data/logs
            STREAM_TOKEN_SECRET_FILE: /run/flixer-secrets/stream-token-secret
            CACHE_PATH: /var/cache/flixer/indexer
        volumes:
            # Read-write so artwork can be stored alongside media.
            - ${MEDIA_PATH:-./media}:/media
            - ${DATA_PATH:?Set DATA_PATH in .env to the folder for Flixer's data}/metadata:/var/cache/flixer/indexer
            - flixer-secrets:/run/flixer-secrets:ro
            - ${DATA_PATH:?Set DATA_PATH in .env to the folder for Flixer's data}/logs:/data/logs
            - ${DATA_PATH:?Set DATA_PATH in .env to the folder for Flixer's data}/mounts:/data/mounts
        expose:
            - "8092"
        restart: unless-stopped
        init: true

    # Bundled database. In the wizard use postgres://flixer:flixer@postgres:5432/flixer (it is pre-filled).
    # Only reachable inside the Compose network; point the wizard at your own server to skip it.
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: flixer
            POSTGRES_PASSWORD: flixer
            POSTGRES_DB: flixer
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U flixer -d flixer"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    # Bundled Redis. In the wizard use redis://redis:6379 (pre-filled), or your own.
    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    web:
        build:
            context: ../flixer-web
            dockerfile: Dockerfile
        image: flixer-dev/web:local
        expose:
            - "80"
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    # Reverse proxy. Its nginx config is the same as deploy/proxy/nginx.conf (with $ written as $$); it is written
    # into the container at start, so this file works on its own with no extra files or mounts.
    proxy:
        image: nginx:alpine
        environment:
            NGINX_CONF: |
                map $$http_upgrade $$connection_upgrade {
                    default upgrade;
                    ''      close;
                }

                map $$http_x_forwarded_proto $$forwarded_proto {
                    default $$http_x_forwarded_proto;
                    ''      $$scheme;
                }

                upstream flixer_api {
                    server api:8081;
                }

                upstream flixer_streamer {
                    server streamer:8091;
                }

                upstream flixer_web {
                    server web:80;
                }

                server {
                    listen 80;
                    server_name _;
                    client_max_body_size 25m;

                    location = /healthz {
                        access_log off;
                        return 204;
                    }

                    location /api/ {
                        proxy_pass http://flixer_api;
                        proxy_http_version 1.1;
                        proxy_set_header Host $$host;
                        proxy_set_header X-Real-IP $$remote_addr;
                        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $$forwarded_proto;
                        proxy_read_timeout 120s;
                    }

                    location /socket.io/ {
                        proxy_pass http://flixer_api;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $$http_upgrade;
                        proxy_set_header Connection $$connection_upgrade;
                        proxy_set_header Host $$host;
                        proxy_set_header X-Real-IP $$remote_addr;
                        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $$forwarded_proto;
                        proxy_read_timeout 1h;
                    }

                    location = /api/live {
                        proxy_pass http://flixer_api;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $$http_upgrade;
                        proxy_set_header Connection $$connection_upgrade;
                        proxy_set_header Host $$host;
                        proxy_set_header X-Real-IP $$remote_addr;
                        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $$forwarded_proto;
                        proxy_read_timeout 1h;
                        proxy_buffering off;
                    }

                    location = /api/logs/stream {
                        proxy_pass http://flixer_api;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $$http_upgrade;
                        proxy_set_header Connection $$connection_upgrade;
                        proxy_set_header Host $$host;
                        proxy_set_header X-Real-IP $$remote_addr;
                        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $$forwarded_proto;
                        proxy_read_timeout 1h;
                        proxy_buffering off;
                    }

                    location /stream/ {
                        proxy_pass http://flixer_streamer;
                        proxy_http_version 1.1;
                        proxy_set_header Host $$host;
                        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                        proxy_set_header Range $$http_range;
                        proxy_set_header If-Range $$http_if_range;
                        proxy_buffering off;
                        proxy_request_buffering off;
                        proxy_read_timeout 1h;
                        proxy_send_timeout 1h;
                    }

                    location /hls/ {
                        proxy_pass http://flixer_streamer;
                        proxy_http_version 1.1;
                        proxy_set_header Host $$host;
                        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                        proxy_buffering off;
                        proxy_read_timeout 120s;
                    }

                    location /info/ {
                        proxy_pass http://flixer_streamer;
                        proxy_http_version 1.1;
                        proxy_set_header Host $$host;
                        proxy_read_timeout 120s;
                    }

                    location ~ ^/(lyrics|subtitles)/ {
                        proxy_pass http://flixer_streamer;
                        proxy_http_version 1.1;
                        proxy_set_header Host $$host;
                        proxy_read_timeout 60s;
                    }

                    location / {
                        proxy_pass http://flixer_web;
                        proxy_http_version 1.1;
                        proxy_set_header Host $$host;
                        proxy_set_header X-Forwarded-Proto $$forwarded_proto;
                    }
                }
        command:
            - /bin/sh
            - -c
            - printf '%s\n' "$$NGINX_CONF" > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
        ports:
            - "${HTTP_PORT:-8080}:80"
        depends_on:
            api:
                condition: service_healthy
            streamer:
                condition: service_healthy
            web:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 3
        restart: unless-stopped

volumes:
    redis-data:
    postgres-data:
    flixer-config:
    flixer-secrets:
