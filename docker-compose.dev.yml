# Development stack: the same as docker-compose.yml, but the API, streamer, indexer and web are built from the sibling
# checkouts (../flixer-streamer, ../flixer-indexer, ../flixer-web) instead of pulling published images.
# Usage: docker compose -f docker-compose.dev.yml up --build
# Settings (in .env next to this file): DATA_DIR is required, MEDIA_PATH defaults to ./media.
name: flixer-dev

services:
    # Creates the data folders and hands them to the users the services run as, then exits.
    data-init:
        image: alpine:3
        command:
            - /bin/sh
            - -c
            - set -e; mkdir -p /data/avatars /data/config /data/database /data/cache/images /data/cache/people /data/cache/theme /data/cache/subtitles /data/cache/trickplay /data/logs /data/mounts /data/backups; chown -R 1000:1000 /data/avatars /data/config /data/mounts /data/backups; chown 70:70 /data/database; chown -R 65532:65532 /data/cache; find /data/cache -type d -exec chmod 2775 {} +; chmod 0777 /data/logs
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}:/data
        restart: "no"

    nginx-config-init:
        image: flixer-dev/api:local
        user: "0:0"
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                set -e
                mkdir -p /data/nginx
                cp /opt/resources/nginx.conf /data/nginx/nginx.conf
                chmod 0644 /data/nginx/nginx.conf
        depends_on:
            data-init:
                condition: service_completed_successfully
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}:/data
        restart: "no"

    api:
        build:
            context: .
            dockerfile: Dockerfile
        image: flixer-dev/api:local
        depends_on:
            data-init:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
        environment:
            PORT: 8081
            NODE_ENV: development
            APP_SECRET_FILE: /run/flixer-secrets/app-secret
            DATA_PATH: /data
            STREAM_MEDIA_ROOT: /media
            LOG_DIR: /data/logs
            STREAMER_PUBLIC_URL: ""
            STREAMER_INTERNAL_URL: http://streamer:8091
            INDEXER_URL: http://indexer:8092
        group_add:
            - "65532"
        volumes:
            - ${MEDIA_PATH:-./media}:/media:ro
            - flixer-secrets:/run/flixer-secrets
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/avatars:/data/avatars
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/config:/data/config
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/cache:/data/cache
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/backups:/data/backups
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/logs:/data/logs
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/mounts:/data/mounts
        expose:
            - "8081"
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "const s=require('node:net').connect(8081,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 45s
        restart: unless-stopped
        init: true

    streamer:
        build:
            context: ../flixer-streamer
            dockerfile: Dockerfile
        image: flixer-dev/streamer:local
        environment:
            PORT: 8091
            LOG_LEVEL: debug
            APP_SECRET_FILE: /run/flixer-secrets/app-secret
            TRANSCODE_DIR: /var/cache/flixer/transcode
            TRICKPLAY_DIR: /data/cache/trickplay
            FLIXER_URL: http://api:8081
            LOG_DIR: /data/logs
        volumes:
            - ${MEDIA_PATH:-./media}:/media:ro
            - flixer-secrets:/run/flixer-secrets:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/logs:/data/logs
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/cache:/data/cache:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/mounts:/data/mounts:ro
        expose:
            - "8091"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/streamer/healthz >/dev/null || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        init: true

    indexer:
        build:
            context: ../flixer-indexer
            dockerfile: Dockerfile
        image: flixer-dev/indexer:local
        depends_on:
            data-init:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        environment:
            PORT: 8092
            LOG_LEVEL: debug
            ROLE: all
            FLIXER_URL: http://api:8081
            LOG_DIR: /data/logs
            APP_SECRET_FILE: /run/flixer-secrets/app-secret
            CACHE_PATH: /data/cache
            TRICKPLAY_DIR: /data/cache/trickplay
        volumes:
            # Read-write so artwork can be stored alongside media.
            - ${MEDIA_PATH:-./media}:/media
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/cache:/data/cache
            - flixer-secrets:/run/flixer-secrets:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/logs:/data/logs
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/mounts:/data/mounts
        expose:
            - "8092"
        restart: unless-stopped
        init: true

    # Bundled database. In the wizard use postgres://flixer:flixer@postgres:5432/flixer (it is pre-filled).
    # Only reachable inside the Compose network; point the wizard at your own server to skip it.
    postgres:
        image: postgres:16-alpine
        depends_on:
            data-init:
                condition: service_completed_successfully
        environment:
            POSTGRES_USER: flixer
            POSTGRES_PASSWORD: flixer
            POSTGRES_DB: flixer
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/database:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U flixer -d flixer"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    # Bundled Redis. In the wizard use redis://redis:6379 (pre-filled), or your own.
    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    web:
        build:
            context: ../flixer-web
            dockerfile: Dockerfile
        image: flixer-dev/web:local
        expose:
            - "80"
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    # Reverse proxy reads the Nginx config copied from the Flixer image into DATA_DIR.
    proxy:
        image: nginx:alpine
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/nginx:/etc/nginx/conf.d:ro
        ports:
            - "${HTTP_PORT:-8080}:80"
        depends_on:
            nginx-config-init:
                condition: service_completed_successfully
            api:
                condition: service_healthy
            streamer:
                condition: service_healthy
            web:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 3
        restart: unless-stopped

volumes:
    redis-data:
    flixer-secrets:
