# Flixer. Start with `docker compose up -d`, open http://localhost:8080 and follow the setup wizard.
#
# Settings, in a .env file next to this file (or exported):
#   DATA_DIR   (required) a folder Flixer keeps its own data in: avatars, config, database, cache, Logger data, legacy log archive, backups and Nginx config.
#   MEDIA_PATH (optional) the folder that holds your media; defaults to ./media.
# Everything else is configured in the wizard.
services:
    # Creates the data folders and hands them to the users the services run as, then exits.
    data-init:
            image: alpine:3
            command:
              - /bin/sh
              - /opt/flixer/init-data.sh
            volumes:
              - ./deploy/docker/init-data.sh:/opt/flixer/init-data.sh:ro
              - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}:/data
              - flixer-secrets:/run/flixer-secrets
            restart: "no"

    nginx-config-init:
        image: ghcr.io/flixermedia/flixer:${FLIXER_VERSION:-latest}
        user: "0:0"
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
                set -e
                mkdir -p /data/nginx
                if [ -f /opt/resources/nginx.conf ] && [ -s /opt/resources/nginx.conf ]; then
                    cp /opt/resources/nginx.conf /data/nginx/nginx.conf
                elif [ -f /data/nginx/nginx.conf ] && [ -s /data/nginx/nginx.conf ]; then
                    echo "Warning: image has no Nginx template; using existing /data/nginx/nginx.conf." >&2
                else
                    echo "Error: image has no Nginx template. Pull a newer Flixer image or place nginx.conf in DATA_DIR/nginx/." >&2
                    exit 1
                fi
                chmod 0644 /data/nginx/nginx.conf
        depends_on:
            data-init:
                condition: service_completed_successfully
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}:/data
        restart: "no"

    logger-cert-init:
        image: ghcr.io/flixermedia/flixer-logger:${LOGGER_VERSION:-latest}
        user: "1000:1000"
        command: ["--init-cert"]
        depends_on:
            data-init:
                condition: service_completed_successfully
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/logs/logger:/data/logs/logger
        restart: "no"

    logger:
        image: ghcr.io/flixermedia/flixer-logger:${LOGGER_VERSION:-latest}
        user: "1000:1000"
        environment:
            FLIXER_URL: http://api:8081
            SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        command:
            - --data-dir
            - /data
            - --listen
            - 0.0.0.0:8098
            - --bootstrap-owner-file
            - /run/flixer-secrets/logger/owner
            - --tls-cert
            - /data/logs/logger/tls.crt
            - --tls-key
            - /data/logs/logger/tls.key
            - --checkpoint-dir
            - /data/logs/logger/checkpoints
        depends_on:
            logger-cert-init:
                condition: service_completed_successfully
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/logs/logger:/data/logs/logger
            - flixer-secrets:/run/flixer-secrets
        expose:
            - "8098"
        healthcheck:
            test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8098/api/health/ready || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s
        restart: unless-stopped
        init: true

    api:
        image: ghcr.io/flixermedia/flixer:${FLIXER_VERSION:-latest}
        depends_on:
            data-init:
                condition: service_completed_successfully
            logger-cert-init:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
        environment:
            PORT: 8081
            APP_SECRET_FILE: /run/flixer-secrets/app-secret
            FLIXER_LOGGER_CONTROL_SOCKET: /run/flixer-secrets/logger-control.sock
            FLIXER_LOGGER_LOCAL_OWNER_FILE: /run/flixer-secrets/logger/owner
            FLIXER_LOGGER_LOCAL_ENDPOINT: https://logger:8098
            NODE_EXTRA_CA_CERTS: /run/flixer-secrets/logger-ca.crt
            DATA_PATH: /data
            STREAM_MEDIA_ROOT: /media
            STREAMER_PUBLIC_URL: ""
            STREAMER_INTERNAL_URL: http://streamer:8091
            INDEXER_URL: http://indexer:8092
            FLIXER_AI_URL: http://ai:8094
            WEB_INTERNAL_URL: http://web
            UPDATER_URL: http://flixer-updater:8093
            MEILISEARCH_URL: http://meilisearch:7700
        group_add:
            - "65532"
        volumes:
            - ${MEDIA_PATH:-./media}:/media:ro
            - flixer-secrets:/run/flixer-secrets
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/logs/logger/tls.crt:/run/flixer-secrets/logger-ca.crt:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/advertisements:/data/advertisements
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/avatars:/data/avatars
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/config:/data/config
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/cache:/data/cache
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/backups:/data/backups
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/mounts:/data/mounts
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/plugins:/data/plugins
        expose:
            - "8081"
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "const s=require('node:net').connect(8081,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 45s
        restart: unless-stopped
        init: true

    streamer:
        image: ghcr.io/flixermedia/flixer-streamer:${STREAMER_VERSION:-latest}
        depends_on:
            data-init:
                condition: service_completed_successfully
        environment:
            PORT: 8091
            APP_SECRET_FILE: /run/flixer-secrets/app-secret
            FLIXER_LOGGER_CONTROL_SOCKET: /run/flixer-secrets/logger-control.sock
            FLIXER_LOGGER_CA_FILE: /run/flixer-secrets/logger-ca.crt
            TRANSCODE_DIR: /var/cache/flixer/transcode
            TRICKPLAY_DIR: /data/cache/trickplay
            FLIXER_URL: http://api:8081
        volumes:
            - ${MEDIA_PATH:-./media}:/media:ro
            - flixer-secrets:/run/flixer-secrets:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/logs/logger/tls.crt:/run/flixer-secrets/logger-ca.crt:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/cache:/data/cache:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/advertisements:/data/advertisements:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/mounts:/data/mounts:ro
        expose:
            - "8091"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/streamer/healthz >/dev/null || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 120s
        restart: unless-stopped
        init: true

    indexer:
        image: ghcr.io/flixermedia/flixer-indexer:${INDEXER_VERSION:-latest}
        depends_on:
            data-init:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
        environment:
            PORT: 8092
            ROLE: all
            FLIXER_URL: http://api:8081
            APP_SECRET_FILE: /run/flixer-secrets/app-secret
            FLIXER_LOGGER_CONTROL_SOCKET: /run/flixer-secrets/logger-control.sock
            FLIXER_LOGGER_CA_FILE: /run/flixer-secrets/logger-ca.crt
            CACHE_PATH: /data/cache
            PLUGINS_PATH: /data/plugins/installed
            TRICKPLAY_DIR: /data/cache/trickplay
        volumes:
            # Read-write so artwork can be stored alongside media.
            - ${MEDIA_PATH:-./media}:/media
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/cache:/data/cache
            - flixer-secrets:/run/flixer-secrets:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/logs/logger/tls.crt:/run/flixer-secrets/logger-ca.crt:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/mounts:/data/mounts
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/plugins:/data/plugins:ro
        expose:
            - "8092"
        restart: unless-stopped
        init: true

    ai:
        image: ghcr.io/flixermedia/flixer-ai:${AI_VERSION:-latest}
        profiles: ["ai"]
        depends_on:
            data-init:
                condition: service_completed_successfully
            api:
                condition: service_healthy
        environment:
            PORT: 8094
            DATA_DIR: /data
            MODELS_DIR: /data/ai/models
            FLIXER_URL: http://api:8081
            FLIXER_INTERNAL_TOKEN_FILE: /run/flixer-secrets/app-secret
            FLIXER_LOGGER_CONTROL_SOCKET: /run/flixer-secrets/logger-control.sock
            FLIXER_LOGGER_CA_FILE: /run/flixer-secrets/logger-ca.crt
            RECOMMENDER_PROFILE: ${RECOMMENDER_PROFILE:-auto}
            ALLOW_DOWNLOADS: ${AI_ALLOW_DOWNLOADS:-true}
            SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/ai:/data/ai
            - flixer-secrets:/run/flixer-secrets:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/logs/logger/tls.crt:/run/flixer-secrets/logger-ca.crt:ro
        expose:
            - "8094"
        restart: unless-stopped
        init: true

    # Optional relay for audio/video calls that can't connect directly (`docker compose --profile calls up`).
    # It only forwards already end-to-end encrypted packets. Its secret is derived from the shared app secret, so leave
    # "TURN secret" empty in Admin > General > Audio and video calls and add turn:<your-host>:3478 there.
    # Open 3478 (tcp+udp) and 49160-49200/udp on your firewall.
    turn:
        image: coturn/coturn:4.6
        profiles: ["calls"]
        depends_on:
            api:
                condition: service_healthy
        entrypoint:
            - /bin/sh
            - -c
            - |
                while [ ! -s /run/flixer-secrets/app-secret ]; do sleep 1; done
                SECRET="$$(printf 'flixer:calls-turn:v1:%s' "$$(cat /run/flixer-secrets/app-secret)" | sha256sum | cut -d' ' -f1)"
                exec turnserver -n --use-auth-secret --static-auth-secret="$$SECRET" --realm=${CALLS_TURN_REALM:-flixer} \
                    --fingerprint --no-cli --no-multicast-peers --min-port=49160 --max-port=49200 \
                    --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255 \
                    --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
        volumes:
            - flixer-secrets:/run/flixer-secrets:ro
        ports:
            - "3478:3478/udp"
            - "3478:3478/tcp"
            - "49160-49200:49160-49200/udp"
        restart: unless-stopped

    # Bundled database. In the wizard use postgres://flixer:flixer@postgres:5432/flixer (it is pre-filled).
    # Only reachable inside the Compose network; point the wizard at your own server to skip it.
    postgres:
        image: postgres:16-alpine
        depends_on:
            data-init:
                condition: service_completed_successfully
        environment:
            POSTGRES_USER: flixer
            POSTGRES_PASSWORD: flixer
            POSTGRES_DB: flixer
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/database:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U flixer -d flixer"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    # Bundled Redis. In the wizard use redis://redis:6379 (pre-filled), or your own.
    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    meilisearch:
        image: getmeili/meilisearch:v1.12
        depends_on:
            data-init:
                condition: service_completed_successfully
        environment:
            MEILI_ENV: production
            MEILI_NO_ANALYTICS: "true"
            MEILI_EXPERIMENTAL_DISABLE_VECTOR_STORE: "true"
        command:
            - /bin/sh
            - -c
            - |
                while [ ! -s /run/flixer-secrets/app-secret ]; do sleep 1; done
                export MEILI_MASTER_KEY="$$(cat /run/flixer-secrets/app-secret)"
                exec /bin/meilisearch
        volumes:
            - ${MEILISEARCH_STORAGE:-${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/meilisearch}:/meili_data
            - flixer-secrets:/run/flixer-secrets:ro
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health >/dev/null || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped

    web:
        image: ghcr.io/flixermedia/flixer-web:${WEB_VERSION:-latest}
        expose:
            - "80"
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    # In-dashboard updates, always part of the stack. No token to set: Flixer and the
    # updater derive it from the shared app secret. The updater is the only container with the Docker socket. When an admin asks from
    # Admin > Updates it backs up the database, pins the new versions in its state volume, recreates the services one by one
    # and rolls back if one does not become healthy. It needs this folder mounted at the same path as on the host
    # (PROJECT_DIR defaults to the current directory). Update the updater itself by pulling its image manually.
    flixer-updater:
        image: ghcr.io/flixermedia/flixer-updater:latest
        depends_on:
            data-init:
                condition: service_completed_successfully
        environment:
            STREAM_TOKEN_SECRET_FILE: /run/flixer-secrets/app-secret
            SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
            FLIXER_LOGGER_CONTROL_SOCKET: /run/flixer-secrets/logger-control.sock
            FLIXER_LOGGER_CA_FILE: /run/flixer-secrets/logger-ca.crt
            DATA_PATH: /data
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - flixer-secrets:/run/flixer-secrets
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/logs/logger/tls.crt:/run/flixer-secrets/logger-ca.crt:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/config:/data/config
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/cache:/data/cache
            - ${PROJECT_DIR:-${PWD}}:${PROJECT_DIR:-${PWD}}:ro
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/updater-state:/state
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/backups:/data/backups
        expose:
            - "8093"
        restart: unless-stopped

    # Reverse proxy reads the Nginx config copied from the Flixer image into DATA_DIR.
    proxy:
        image: nginx:alpine
        volumes:
            - ${DATA_DIR:?Set DATA_DIR in .env to the folder for Flixer's data}/nginx:/etc/nginx/conf.d:ro
        ports:
            - "${HTTP_PORT:-8080}:80"
        depends_on:
            nginx-config-init:
                condition: service_completed_successfully
            api:
                condition: service_healthy
            streamer:
                condition: service_healthy
            web:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 3
        restart: unless-stopped

volumes:
    flixer-secrets:
    meilisearch-data:
