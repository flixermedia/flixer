services:
    api:
        image: ghcr.io/flixermedia/flixer:latest
        build:
            context: .
            dockerfile: Dockerfile
            args:
                - http_proxy
                - https_proxy
                - no_proxy
        env_file:
            - .env
        environment:
            PORT: 8081
            AVATAR_DIR: /data/avatars
            MEDIA_IMAGE_DIR: /data/media-images
            STREAM_MEDIA_ROOT: /media
            # LOG_DIR in .env is for native runs; file logging is off here (logs go to the container output).
            LOG_DIR: ""
            STREAMER_PUBLIC_URL: ""
            STREAMER_INTERNAL_URL: http://streamer:8091
            INDEXER_URL: http://indexer:8092
        volumes:
            - ${AVATAR_PATH:-../flixer-data/avatars}:/data/avatars
            - ${MEDIA_IMAGE_PATH:-../flixer-data/media-images}:/data/media-images
            - ${MEDIA_PATH:-../flixer-data/media}:/media:ro
        expose:
            - "8081"
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "const s=require('node:net').connect(8081,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 45s
        restart: unless-stopped
        init: true

    streamer:
        image: ghcr.io/flixermedia/flixer-streamer:latest
        environment:
            PORT: 8091
            STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:?Set STREAM_TOKEN_SECRET in .env}
            FFMPEG_PATH: ffmpeg
            FFPROBE_PATH: ffprobe
            TRANSCODE_DIR: /var/cache/flixer/transcode
            FLIXER_URL: http://api:8081
            MAX_TRANSCODES: ${MAX_TRANSCODES:-2}
            LOG_LEVEL: ${STREAMER_LOG_LEVEL:-info}
        volumes:
            - ${MEDIA_PATH:-../flixer-data/media}:/media:ro
        expose:
            - "8091"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/healthz >/dev/null || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        init: true

    indexer:
        image: ghcr.io/flixermedia/flixer-indexer:latest
        depends_on:
            redis:
                condition: service_healthy
        environment:
            PORT: 8092
            ROLE: all
            FLIXER_URL: http://api:8081
            STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:?Set STREAM_TOKEN_SECRET in .env}
            REDIS_ADDR: redis:6379
            CACHE_PATH: /var/cache/flixer/indexer
            LOG_LEVEL: ${INDEXER_LOG_LEVEL:-info}
        volumes:
            # Read-write so artwork can be stored alongside media; use :ro if every library uses cache image storage.
            - ${MEDIA_PATH:-../flixer-data/media}:/media
            - indexer-cache:/var/cache/flixer/indexer
        expose:
            - "8092"
        restart: unless-stopped
        init: true

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    web:
        image: ghcr.io/flixermedia/flixer-web:latest
        expose:
            - "80"
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    proxy:
        build:
            context: ./deploy/proxy
        ports:
            - "${HTTP_PORT:-8080}:80"
        depends_on:
            api:
                condition: service_healthy
            streamer:
                condition: service_healthy
            web:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz >/dev/null || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 3
        restart: unless-stopped

volumes:
    redis-data:
    indexer-cache:
