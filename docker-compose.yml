# Flixer. Start with `docker compose up -d`, open http://localhost:8080 and follow the setup wizard.
#
# The only thing to set is where your media lives: put MEDIA_PATH=/path/to/your/media in a .env file next to this
# file (or export it). Everything else is configured in the wizard.
services:
    api:
        image: ghcr.io/flixermedia/flixer:latest
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PORT: 8081
            CONFIG_DIR: /var/lib/flixer/config
            STREAM_TOKEN_SECRET_FILE: /run/flixer-secrets/stream-token-secret
            AVATAR_DIR: /data/avatars
            MEDIA_IMAGE_DIR: /data/media-images
            STREAM_MEDIA_ROOT: /media
            LOG_DIR: ""
            STREAMER_PUBLIC_URL: ""
            STREAMER_INTERNAL_URL: http://streamer:8091
            INDEXER_URL: http://indexer:8092
        volumes:
            - ${MEDIA_PATH:-./media}:/media:ro
            - flixer-config:/var/lib/flixer/config
            - flixer-secrets:/run/flixer-secrets
            - flixer-avatars:/data/avatars
            - flixer-media-images:/data/media-images
        expose:
            - "8081"
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "const s=require('node:net').connect(8081,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 45s
        restart: unless-stopped
        init: true

    streamer:
        image: ghcr.io/flixermedia/flixer-streamer:latest
        environment:
            PORT: 8091
            STREAM_TOKEN_SECRET_FILE: /run/flixer-secrets/stream-token-secret
            TRANSCODE_DIR: /var/cache/flixer/transcode
            FLIXER_URL: http://api:8081
        volumes:
            - ${MEDIA_PATH:-./media}:/media:ro
            - flixer-secrets:/run/flixer-secrets:ro
        expose:
            - "8091"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/healthz >/dev/null || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        init: true

    indexer:
        image: ghcr.io/flixermedia/flixer-indexer:latest
        depends_on:
            redis:
                condition: service_healthy
        environment:
            PORT: 8092
            ROLE: all
            FLIXER_URL: http://api:8081
            STREAM_TOKEN_SECRET_FILE: /run/flixer-secrets/stream-token-secret
            CACHE_PATH: /var/cache/flixer/indexer
        volumes:
            # Read-write so artwork can be stored alongside media.
            - ${MEDIA_PATH:-./media}:/media
            - indexer-cache:/var/cache/flixer/indexer
            - flixer-secrets:/run/flixer-secrets:ro
        expose:
            - "8092"
        restart: unless-stopped
        init: true

    # Bundled database. In the wizard use postgres://flixer:flixer@postgres:5432/flixer (it is pre-filled).
    # Only reachable inside the Compose network; point the wizard at your own server to skip it.
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: flixer
            POSTGRES_PASSWORD: flixer
            POSTGRES_DB: flixer
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U flixer -d flixer"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    # Bundled Redis. In the wizard use redis://redis:6379 (pre-filled), or your own.
    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    web:
        image: ghcr.io/flixermedia/flixer-web:latest
        expose:
            - "80"
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    proxy:
        build:
            context: ./deploy/proxy
        ports:
            - "${HTTP_PORT:-8080}:80"
        depends_on:
            api:
                condition: service_healthy
            streamer:
                condition: service_healthy
            web:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz >/dev/null || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 3
        restart: unless-stopped

volumes:
    redis-data:
    postgres-data:
    flixer-config:
    flixer-secrets:
    flixer-avatars:
    flixer-media-images:
    indexer-cache:
